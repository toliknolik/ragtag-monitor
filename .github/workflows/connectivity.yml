name: RAGTAG JSON snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - 'build_shortlist.py'
  schedule:
    - cron: '15 5 * * *' # Daily 05:15 UTC, before the ChatGPT check

permissions:
  contents: write

concurrency:
  group: ragtag-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve previous complete snapshot for comparison
        run: |
          if [ -f products.json ]; then cp products.json /tmp/ragtag-previous.json; fi
      - name: Fetch and split all men's blouson collections
        run: python fetch_catalog.py
      - name: Build readable designer shortlist
        run: python build_shortlist.py
      - name: Generate compact change report
        run: python monitor_changes.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json catalog/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update RAGTAG catalog and chunks"
            # Another commit may have landed after checkout (e.g. an edit from ChatGPT).
            # Rebase our generated snapshot onto the latest main before pushing.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Snapshot pushed successfully"
                exit 0
              fi
              echo "Push raced with another update (attempt $attempt); retrying"
              sleep $((attempt * 2))
            done
            echo "ERROR: Failed to push after 3 retries"
            exit 1
          fi
