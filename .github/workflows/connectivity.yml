
name: RAGTAG JSON snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch complete Shopify JSON
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          products = []
          seen = set()

          for page in range(1, 101):
              url = (
                  "https://ragtag-global.com/collections/"
                  "men_blousonjackets_millitaryjackets/"
                  f"products.json?limit=250&page={page}"
              )

              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Mozilla/5.0"}
                      )
                      with urllib.request.urlopen(req, timeout=30) as r:
                          data = json.load(r)
                      if not isinstance(data, dict) or not isinstance(data.get("products"), list):
                          raise ValueError("Invalid Shopify JSON")
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(2 ** attempt)

              batch = data["products"]
              print(f"Page {page}: {len(batch)} products")

              for product in batch:
                  pid = product["id"]
                  if pid in seen:
                      raise ValueError(f"Duplicate product ID: {pid}")
                  seen.add(pid)
                  products.append(product)

              if len(batch) < 250:
                  break
          else:
              raise RuntimeError("Pagination safety limit reached")

          with open("products.json", "w") as f:
              json.dump(
                  {"products": products},
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"Saved {len(products)} products")
          PY

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update RAGTAG catalog snapshot"
            git push
          fi
