name: RAGTAG JSON snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *' # Daily 05:15 UTC, before the ChatGPT check

permissions:
  contents: write

concurrency:
  group: ragtag-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve previous complete snapshot for comparison
        run: |
          if [ -f products.json ]; then cp products.json /tmp/ragtag-previous.json; fi
      - name: Fetch and split complete Shopify JSON
        run: |
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          products, seen, page_counts = [], set(), []
          for page in range(1, 101):
              url = ("https://ragtag-global.com/collections/"
                     "men_blousonjackets_millitaryjackets/"
                     f"products.json?limit=250&page={page}")
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          if response.status != 200:
                              raise RuntimeError(f"HTTP {response.status}")
                          data = json.load(response)
                      if not isinstance(data, dict) or not isinstance(data.get("products"), list):
                          raise ValueError("Invalid Shopify JSON")
                      break
                  except Exception:
                      if attempt == 2: raise
                      time.sleep(2 ** attempt)
              batch = data["products"]
              if len(batch) > 250: raise ValueError("More than 250 products on page")
              page_counts.append(len(batch))
              print(f"Page {page}: {len(batch)} products")
              for p in batch:
                  if not isinstance(p, dict) or not p.get("id"): raise ValueError("Invalid product")
                  if p["id"] in seen: raise ValueError(f"Duplicate ID {p['id']}")
                  seen.add(p["id"])
                  products.append(p)
              if len(batch) < 250: break
          else:
              raise RuntimeError("Pagination exceeded safety limit")

          Path("products.json").write_text(json.dumps({"products": products}, ensure_ascii=False, indent=2) + "\n")
          out = Path("catalog")
          out.mkdir(exist_ok=True)
          for old in out.glob("part-*.json"): old.unlink()
          chunk_size = 5
          manifest = []
          for i, offset in enumerate(range(0, len(products), chunk_size), 1):
              filename = f"part-{i:03d}.json"
              chunk = products[offset:offset+chunk_size]
              (out / filename).write_text(json.dumps({"products": chunk}, ensure_ascii=False, separators=(",", ":")) + "\n")
              manifest.append({"file": filename, "count": len(chunk)})
          (out / "manifest.json").write_text(
              json.dumps({"total_products": len(products), "page_counts": page_counts, "parts": manifest}, indent=2) + "\n")
          print(f"Saved {len(products)} products across {len(manifest)} small files")
          PY
      - name: Generate compact change report
        run: python monitor_changes.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json catalog/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update RAGTAG catalog and chunks"
            # Another commit may have landed after checkout (e.g. an edit from ChatGPT).
            # Rebase our generated snapshot onto the latest main before pushing.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Snapshot pushed successfully"
                exit 0
              fi
              echo "Push raced with another update (attempt $attempt); retrying"
              sleep $((attempt * 2))
            done
            echo "ERROR: Failed to push after 3 retries"
            exit 1
          fi
